# Generated by zLeafNinja/ci-workflows — do not hand-edit.
# Change the template there and re-run sync_ci.py; local edits are overwritten.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# NOTE: no top-level `permissions:` block. Forgejo does not implement it and
# warns "has a permissions field which is not supported ... and will be ignored".

concurrency:
  group: ci-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: pnpm · install
    runs-on: forgejo-ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: echo 'no scripts to run'
