# Generated by zLeafNinja/ci-workflows — do not hand-edit.
# Change the template there and re-run sync_ci.py; local edits are overwritten.
name: ci
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Forgejo does not implement top-level `permissions:`; including it only
# produces a "not supported ... will be ignored" warning.

concurrency:
  group: ci-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: pnpm · install
    runs-on: forgejo-ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "8"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: install
        run: pnpm install --no-frozen-lockfile
